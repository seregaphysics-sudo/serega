<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Water Polo 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#072a40;font-family:sans-serif}
#g{position:fixed;inset:0;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
#rad{width:70px;height:105px;background:rgba(6,38,58,.65);border:2px solid rgba(255,255,255,.5);border-radius:8px}
#sc{display:flex;align-items:center;gap:10px;background:rgba(6,38,58,.75);border:1px solid rgba(255,255,255,.35);padding:8px 14px;border-radius:20px;color:#fff;font-weight:700;height:fit-content}
.d{width:12px;height:12px;border-radius:50%;display:inline-block}
#joy{position:fixed;bottom:28px;left:20px;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);z-index:15;touch-action:none}
#kn{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:rgba(255,255,255,.85)}
#btns{position:fixed;bottom:34px;right:20px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:15}
.b{width:76px;height:76px;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#sh{background:#e64a19}#ps{background:#0277bd;width:66px;height:66px}
#pw{position:fixed;bottom:196px;right:44px;width:14px;height:85px;background:rgba(0,0,0,.5);border:2px solid #fff;border-radius:8px;display:none;overflow:hidden;z-index:15}
#pf{position:absolute;bottom:0;width:100%;height:0%;background:linear-gradient(to top,#4caf50,#ffeb3b,#f44336)}
#msg{position:fixed;top:32%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#ffd54f;padding:12px 24px;border-radius:14px;border:2px solid #ffd54f;font-size:24px;font-weight:900;display:none;z-index:25}
#ov{position:fixed;inset:0;background:rgba(1,42,74,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;z-index:30}
#st{background:#ffb300;color:#012a4a;border:none;padding:18px 48px;border-radius:30px;font-size:20px;font-weight:800;margin-top:20px;touch-action:manipulation;cursor:pointer}
</style>
</head>
<body>
<div id="g"></div>
<div id="hud"><canvas id="rad" width="70" height="105"></canvas><div id="sc"><span class="d" style="background:#1e88e5"></span><span id="sb">0</span> <span id="tm" style="color:#ffd54f">02:00</span> <span id="sw">0</span><span class="d" style="background:#fff"></span></div></div>
<div id="joy"><div id="kn"></div></div>
<div id="pw"><div id="pf"></div></div>
<div id="btns"><button id="sh" class="b">БРОСОК</button><button id="ps" class="b">ПАС</button></div>
<div id="msg">ГОЛ!</div>
<div id="ov"><h1>ВОДНОЕ ПОЛО 3D</h1><p style="margin-top:10px;line-height:1.5;color:#e1f5fe"><b>Левый стик</b> — плыть<br><b>Свайп</b> — поворот камеры<br><b>ПАС</b> — пас партнеру<br><b>БРОСОК</b> — удерж. для силы</p><button id="st" type="button">ИГРАТЬ</button></div>
<script src="https://unpkg.com"></script>
<script>
const W=20,L=30,GW=3,GH=1,box=document.getElementById('g'),scene=new THREE.Scene();
scene.background=new THREE.Color(0x81d4fa);
const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,100),ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));box.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x0288d1,1));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(10,20,10);scene.add(dl);
const water=new THREE.Mesh(new THREE.PlaneGeometry(W,L),new THREE.MeshPhongMaterial({color:0x00acc1,shininess:80,transparent:true,opacity:.88}));
water.rotation.x=-Math.PI/2;scene.add(water);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(W,L),new THREE.MeshBasicMaterial({color:0x26c6da}));fl.rotation.x=-Math.PI/2;fl.position.y=-1.2;scene.add(fl);
const wm=new THREE.MeshLambertMaterial({color:0xeceff1});
[[-W/2-.4,0,.8,L+1.6],[W/2+.4,0,.8,L+1.6],[0,-L/2-.4,W+1.6,.8],[0,L/2+.4,W+1.6,.8]].forEach(a=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a,.8,a),wm);m.position.set(a,.2,a);scene.add(m)});
[[0,0xffffff],[-L/2+2,0xe53935],[L/2-2,0xe53935],[-L/2+5,0xffeb3b],[L/2-5,0xffeb3b]].forEach(l=>{const m=new THREE.Mesh(new THREE.BoxGeometry(W+.9,.12,.15),new THREE.MeshBasicMaterial({color:l}));m.position.set(0,.58,l);scene.add(m)});
[-L/2+.2,L/2-.2].forEach(z=>{const g=new THREE.Group(),pm=new THREE.MeshLambertMaterial({color:0xffffff}),p1=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,GH),pm),p2=p1.clone(),tp=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,GW+.12),pm),nt=new THREE.Mesh(new THREE.BoxGeometry(GW,GH,.8),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.4}));p1.position.set(-GW/2,GH/2,0);p2.position.set(GW/2,GH/2,0);tp.rotation.z=Math.PI/2;tp.position.set(0,GH,0);nt.position.set(0,GH/2,z<0?-.4:.4);g.add(p1,p2,tp,nt);g.position.set(0,0,z);scene.add(g)});
function mkSw(t,gk){const r=new THREE.Group(),sk=new THREE.MeshLambertMaterial({color:0xffcc80}),cm=new THREE.MeshLambertMaterial({color:gk?0xd32f2f:(t=='blue'?0x1565c0:0xf5f5f5)}),bd=new THREE.Mesh(new THREE.BoxGeometry(.62,.25,.35),sk),hd=new THREE.Mesh(new THREE.SphereGeometry(.16,12,12),sk),cp=new THREE.Mesh(new THREE.SphereGeometry(.17,12,12,0,Math.PI*2,0,Math.PI*.6),cm),aL=new THREE.Mesh(new THREE.CylinderGeometry(.05,.04,.46),sk),aR=aL.clone(),rg=new THREE.Mesh(new THREE.RingGeometry(.5,.62,20),new THREE.MeshBasicMaterial({color:0xffeb3b,side:THREE.DoubleSide}));bd.position.y=.05;hd.position.set(0,.32,-.05);cp.position.copy(hd.position);aL.position.set(-.35,.22,-.05);aR.position.set(.35,.22,-.05);rg.rotation.x=-Math.PI/2;rg.position.y=.03;rg.visible=false;r.add(bd,hd,cp,aL,aR,rg);scene.add(r);return{r,aL,aR,rg}}
const bm=new THREE.Mesh(new THREE.SphereGeometry(.14,12,12),new THREE.MeshLambertMaterial({color:0xffd600}));scene.add(bm);
const ball={p:new THREE.Vector3(0,.15,0),v:new THREE.Vector3(),ow:null},pls=[];let ct=null,sb=0,sw=0,tl=120,run=false,yaw=0;
const fB=[{x:0,z:L/2-.8,g:1},{x:-5,z:8,g:0},{x:5,z:8,g:0},{x:0,z:4,g:0},{x:-6,z:-2,g:0},{x:6,z:-2,g:0},{x:0,z:-4,g:0}];
const fW=[{x:0,z:-L/2+.8,g:1},{x:-5,z:-8,g:0},{x:5,z:-8,g:0},{x:0,z:-4,g:0},{x:-6,z:2,g:0},{x:6,z:2,g:0},{x:0,z:4,g:0}];
function init(){pls.forEach(p=>scene.remove(p.m.r));pls.length=0;fB.forEach(f=>pls.push({t:'blue',gk:!!f.g,h:new THREE.Vector3(f.x,0,f.z),p:new THREE.Vector3(f.x,0,f.z),y:0,ph:Math.random()*6,m:mkSw('blue',!!f.g)}));fW.forEach(f=>pls.push({t:'white',gk:!!f.g,h:new THREE.Vector3(f.x,0,f.z),p:new THREE.Vector3(f.x,0,f.z),y:Math.PI,ph:Math.random()*6,m:mkSw('white',!!f.g)}));rst('blue')}
function rst(t){pls.forEach(p=>{p.p.copy(p.h);p.y=p.t=='blue'?0:Math.PI});const s=pls.find(p=>p.t==t&&!p.gk&&p.h.z==(t=='blue'?4:-4));gv(s);if(t!='blue')sCt(pls.find(p=>p.t=='blue'&&!p.gk))}
function gv(p){ball.ow=p;ball.v.set(0,0,0);if(p&&p.t=='blue')sCt(p)}
function sCt(p){if(ct)ct.m.rg.visible=false;ct=p;if(ct){ct.m.rg.visible=true;yaw=ct.y}}
let jv={x:0,y:0},jId=null;const joy=document.getElementById('joy'),kn=document.getElementById('kn');
joy.addEventListener('touchstart',e=>{e.preventDefault();jId=e.changedTouches.identifier;mJ(e.changedTouches)},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(let t of e.changedTouches)if(t.identifier===jId)mJ(t)},{passive:false});
joy.addEventListener('touchend',e=>{for(let t of e.changedTouches)if(t.identifier===jId){jId=null;jv={x:0,y:0};kn.style.transform=''}});
function mJ(t){const r=joy.getBoundingClientRect();let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy);if(d>40){dx=dx/d*40;dy=dy/d*40}kn.style.transform=`translate(${dx}px,${dy}px)`;jv={x:dx/40,y:dy/40}}
let cId=null,lx=0;box.addEventListener('touchstart',e=>{cId=e.changedTouches.identifier;lx=e.changedTouches.clientX},{passive:true});
box.addEventListener('touchmove',e=>{for(let t of e.changedTouches)if(t.identifier===cId){yaw-=(t.clientX-lx)*.008;lx=t.clientX;if(ctrl)ct.y=yaw}},{passive:true});
document.getElementById('ps').addEventListener('touchstart',e=>{e.preventDefault();if(!run||!ct)return;if(ball.ow!==ct){let b=null,md=999;pls.filter(p=>p.t=='blue').forEach(p=>{let d=p.p.distanceTo(ball.p);if(d<md){md=d;b=p}});if(b)sCt(b);return}const fw=new THREE.Vector3(-Math.sin(ct.y),0,-Math.cos(ct.y));let tg=null,bs=-999;pls.filter(p=>p.t=='blue'&&p!==ct).forEach(p=>{let to=p.p.clone().sub(ct.p),sc=fw.dot(to.clone().normalize())*10-to.length()*.15;if(sc>bs){bs=sc;tg=p}});if(tg){let df=tg.p.clone().sub(ball.p),t=Math.max(.25,Math.hypot(df.x,df.z)/14);ball.ow=null;ball.v.set(df.x/t,4.9*t*.45,df.z/t);sCt(tg)}},{passive:false});
let chg=false,pwr=0;const pW=document.getElementById('pw'),pF=document.getElementById('pf');
document.getElementById('sh').addEventListener('touchstart',e=>{e.preventDefault();if(!run||ball.ow!==ct)return;chg=true;pwr=.3;pW.style.display='block'},{passive:false});
document.getElementById('sh').addEventListener('touchend',e=>{e.preventDefault();if(!chg)return;chg=false;pW.style.display='none';if(ball.ow===ct){const aim=new THREE.Vector3(-Math.sin(ct.y),0,-Math.cos(ct.y)),toG=new THREE.Vector3((Math.random()-.5)*2.2,.5,-L/2+.2).sub(ct.p).normalize(),dir=aim.dot(toG)>.4?aim.lerp(toG,.65).normalize():aim,spd=13+pwr*12;ball.ow=null;ball.v.set(dir.x*spd,2.2+pwr*2.4,dir.z*spd)}},{passive:false});
function bnr(t){const m=document.getElementById('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',1600)}
